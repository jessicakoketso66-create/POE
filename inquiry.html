    <div class="container" form id="inquiry-form">

        <h3>Inquiry Form</h3>
        <position:centre; left: 20px; top: 10px;>
        <p>Have a question or want to learn more about our products? Fill out the form below and we'll get back to you as soon as possible.</p>

        <form>
            <position:centre; left: 20px; top: 10px;>
            <label for="name">Full Name:</label><br>
            <input type="text" id="full-name" name="full-name" required>
        </br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
    </br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" required>
</br>

            <label for="message">Your Inquiry:</label><br>
            <textarea id="message" name="message" rows="5" required></textarea>
</br>

            <button type="button" id="submit-button">Submit</button>
        </form>

    </div>
